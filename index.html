    :root {
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --accent-green: #10B981;
      --badge-normal: #E0E7FF;
      --text-normal: #3730A3;
      --badge-importante: #FEF3C7;
      --text-importante: #92400E;
      --badge-urgente: #FEE2E2;
      --text-urgente: #991B1B;
      --border-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

    /* Header Prémium */
    .app-header {
      background: white;
      border-bottom: 1px solid #E2E8F0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 2rem;
      border-radius: 0 0 16px 16px;
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.25rem; color: var(--primary); }
    .badge-pro { background: #EDE9FE; color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

    /* App Container */
    .app-wrapper { max-width: 900px; margin: 0 auto 4rem; padding: 0 1.5rem; }
    .app-card { background: var(--card-bg); border-radius: var(--border-radius); border: 1px solid #E2E8F0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 2rem; }
    
    .app-section { margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid #F1F5F9; }
    .app-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .app-section h2 { font-size: 1.35rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

    /* Progress Bar */
    .progress-container { background: #E2E8F0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 1rem; overflow: hidden; }
    .progress-bar { background: var(--accent-green); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* Inputs & Forms */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; }
    .input-field, .select-field { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.95rem; outline: none; }
    .input-field:focus, .select-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
