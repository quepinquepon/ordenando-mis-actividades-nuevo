<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Ordenando mis Actividades</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --normal: #10b981;
            --important: #f59e0b;
            --urgent: #ef4444;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        header {
            text-align: center;
            padding: 1.5rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
        }

        header h1 { font-size: 1.5rem; color: var(--text); margin-bottom: 0.25rem; }
        header p { color: var(--text-muted); font-size: 0.9rem; }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab-btn {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        main { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; flex: 1; }

        section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .hidden { display: none !important; }
        h2 { font-size: 1.2rem; margin-bottom: 0.75rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: var(--primary-hover); }

        .task-card {
            background: #f8fafc;
            border-left: 4px solid var(--normal);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-card.urgente { border-left-color: var(--urgent); }
        .task-card.importante { border-left-color: var(--important); }
        .task-card.completed { opacity: 0.5; text-decoration: line-through; }

        .alert-box {
            background: #fef2f2;
            border: 2px solid var(--urgent);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        .alert-box.success { background: #f0fdf4; border-color: var(--normal); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 0.5rem; }
        .cal-header { text-align: center; font-weight: 700; color: var(--text-muted); font-size: 0.8rem; }
        .cal-day {
            min-height: 45px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .cal-day.today { border: 2px dashed var(--primary); }
        .cal-day.selected { background: var(--primary); color: #fff; }
        .cal-badge { width: 8px; height: 8px; border-radius: 50%; margin-top: 2px; }
        .cal-badge.urgente { background: var(--urgent); }
        .cal-badge.importante { background: var(--important); }
        .cal-badge.normal { background: var(--normal); }

        footer { text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>📚 ORDENANDO MIS ACTIVIDADES</h1>
        <p>Versión Ultra Liviana y Directa</p>
    </header>

    <main>
        <!-- Navegación -->
        <nav class="tabs-nav" id="navTabs">
            <button class="tab-btn active" data-target="inicio">🏠 Inicio</button>
            <button class="tab-btn" data-target="tareas">📋 Tareas</button>
            <button class="tab-btn" data-target="agregar">➕ Nueva</button>
            <button class="tab-btn" data-target="calendario">📅 Calendario</button>
            <button class="tab-btn" data-target="materias">📚 Materias</button>
        </nav>

        <!-- SECCIÓN INICIO -->
        <section id="sec-inicio" class="pane">
            <h2>📢 Alertas y Vencimientos</h2>
            <div id="alertsContainer"></div>
        </section>

        <!-- SECCIÓN TAREAS -->
        <section id="sec-tareas" class="pane hidden">
            <h2>📋 Mis Tareas</h2>
            <div id="taskList"></div>
        </section>

        <!-- SECCIÓN AGREGAR TAREA -->
        <section id="sec-agregar" class="pane hidden">
            <h2>➕ Agregar Tarea</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="taskTitle" required placeholder="Ej: Estudiar Matemática">
                </div>
                <div class="form-group">
                    <label>Materia</label>
                    <select id="taskSubject"></select>
                </div>
                <div class="form-group">
                    <label>Prioridad</label>
                    <select id="taskPriority">
                        <option value="normal">🟢 Normal</option>
                        <option value="importante">🟡 Importante</option>
                        <option value="urgente">🔴 Urgente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Vencimiento</label>
                    <input type="date" id="taskDueDate" required>
                </div>
                <button type="submit" class="btn">Guardar Tarea</button>
            </form>
        </section>

        <!-- SECCIÓN CALENDARIO -->
        <section id="sec-calendario" class="pane hidden">
            <h2>📅 Calendario</h2>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
                <button class="btn" id="prevMonth">◀</button>
                <h3 id="calMonthTitle" style="font-size:1rem; text-transform:capitalize;"></h3>
                <button class="btn" id="nextMonth">▶</button>
            </div>
            <div class="calendar-grid">
                <div class="cal-header">L</div><div class="cal-header">M</div><div class="cal-header">X</div>
                <div class="cal-header">J</div><div class="cal-header">V</div><div class="cal-header">S</div><div class="cal-header">D</div>
            </div>
            <div id="calendarDays" class="calendar-grid"></div>
            <div id="dayTasks" style="margin-top: 1rem; font-size: 0.9rem;"></div>
        </section>

        <!-- SECCIÓN MATERIAS -->
        <section id="sec-materias" class="pane hidden">
            <h2>📚 Materias</h2>
            <div class="form-group">
                <input type="text" id="newSubjectInput" placeholder="Nombre de la materia">
                <button class="btn" id="btnAddSubject">Agregar</button>
            </div>
            <ul id="subjectsList" style="list-style:none; display:flex; flex-direction:column; gap:0.4rem; margin-top:0.5rem;"></ul>
        </section>
    </main>

    <footer>Tus datos se guardan en este dispositivo.</footer>

    <script>
        // Sistema Base Confiable Sin Bloqueos
        let tasks = JSON.parse(localStorage.getItem('app_tasks') || '[]');
        let subjects = JSON.parse(localStorage.getItem('app_subjects') || '["Matemática", "Lengua", "Ciencias"]');
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDateStr = null;

        // Pestañas
        document.getElementById('navTabs').addEventListener('click', e => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const target = btn.getAttribute('data-target');
            
            document.querySelectorAll('.pane').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`sec-${target}`).classList.remove('hidden');
            btn.classList.add('active');

            if (target === 'inicio') renderAlerts();
            if (target === 'tareas') renderTasks();
            if (target === 'agregar') populateSubjects();
            if (target === 'calendario') renderCalendar();
            if (target === 'materias') renderSubjects();
        });

        // Alertas
        function renderAlerts() {
            const box = document.getElementById('alertsContainer');
            const today = new Date().toISOString().split('T')[0];
            const pending = tasks.filter(t => !t.completed && t.dueDate <= today);

            if (pending.length === 0) {
                box.innerHTML = `<div class="alert-box success">🟢 ¡Todo al día! No tenés pendientes urgentes para hoy.</div>`;
                return;
            }
            box.innerHTML = pending.map(t => `
                <div class="alert-box">
                    <strong>🚨 VENCE HOY/ATRASADA: "${t.title}"</strong>
                    <p>Materia: ${t.subject} | Vencimiento: ${t.dueDate}</p>
                </div>
            `).join('');
        }

        // Tareas
        function renderTasks() {
            const list = document.getElementById('taskList');
            if (tasks.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted)">No hay tareas guardadas.</p>';
                return;
            }
            list.innerHTML = tasks.map((t, i) => `
                <div class="task-card ${t.priority} ${t.completed ? 'completed' : ''}">
                    <div>
                        <strong>${t.title}</strong>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${t.subject} — Vence: ${t.dueDate}</div>
                    </div>
                    <div style="display:flex; gap:0.3rem;">
                        <button class="btn" onclick="toggleTask(${i})" style="padding:0.3rem 0.6rem; font-size:0.75rem;">${t.completed ? '↩️' : '✅'}</button>
                        <button class="btn" onclick="deleteTask(${i})" style="background:var(--urgent); padding:0.3rem 0.6rem; font-size:0.75rem;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        window.toggleTask = function(i) {
            tasks[i].completed = !tasks[i].completed;
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderTasks();
        };

        window.deleteTask = function(i) {
            tasks.splice(i, 1);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderTasks();
        };

        document.getElementById('taskForm').addEventListener('submit', e => {
            e.preventDefault();
            tasks.push({
                title: document.getElementById('taskTitle').value,
                subject: document.getElementById('taskSubject').value,
                priority: document.getElementById('taskPriority').value,
                dueDate: document.getElementById('taskDueDate').value,
                completed: false
            });
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            e.target.reset();
            alert('¡Tarea guardada!');
            document.querySelector('[data-target="tareas"]').click();
        });

        function populateSubjects() {
            const sel = document.getElementById('taskSubject');
            sel.innerHTML = subjects.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        // Materias
        function renderSubjects() {
            const list = document.getElementById('subjectsList');
            list.innerHTML = subjects.map((s, i) => `
                <li style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.9rem;">
                    <span>${s}</span>
                    <button class="btn" onclick="deleteSub(${i})" style="background:var(--urgent); padding:0.2rem 0.4rem; font-size:0.7rem;">X</button>
                </li>
            `).join('');
        }

        document.getElementById('btnAddSubject').addEventListener('click', () => {
            const inp = document.getElementById('newSubjectInput');
            if (inp.value.trim()) {
                subjects.push(inp.value.trim());
                localStorage.setItem('app_subjects', JSON.stringify(subjects));
                inp.value = '';
                renderSubjects();
            }
        });

        window.deleteSub = function(i) {
            subjects.splice(i, 1);
            localStorage.setItem('app_subjects', JSON.stringify(subjects));
            renderSubjects();
        };

        // Calendario
        function renderCalendar() {
            const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('calMonthTitle').innerText = `${months[currentMonth]} ${currentYear}`;
            
            const grid = document.getElementById('calendarDays');
            grid.innerHTML = '';

            const firstDay = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date().toISOString().split('T')[0];

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

            for (let d = 1; d <= totalDays; d++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(d).padStart(2, '0');
                const dateStr = `${currentYear}-${mStr}-${dStr}`;

                const dayTasks = tasks.filter(t => t.dueDate === dateStr && !t.completed);
                let badge = '';
                if (dayTasks.length > 0) {
                    const urgent = dayTasks.some(t => t.priority === 'urgente');
                    const imp = dayTasks.some(t => t.priority === 'importante');
                    badge = `<div class="cal-badge ${urgent ? 'urgent' : (imp ? 'importante' : 'normal')}"></div>`;
                }

                grid.innerHTML += `
                    <div class="cal-day ${dateStr === today ? 'today' : ''} ${dateStr === selectedDateStr ? 'selected' : ''}" onclick="selectDate('${dateStr}')">
                        <span>${d}</span>
                        ${badge}
                    </div>
                `;
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });

        window.selectDate = function(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
            const dayTasks = tasks.filter(t => t.dueDate === dateStr);
            const box = document.getElementById('dayTasks');
            if (dayTasks.length === 0) {
                box.innerHTML = `<strong>Día ${dateStr}:</strong> Sin tareas asignadas.`;
                return;
            }
            box.innerHTML = `<strong>Tareas para el ${dateStr}:</strong>` + dayTasks.map(t => `
                <div style="background:#f8fafc; padding:0.4rem; margin-top:0.3rem; border-radius:4px; border-left:3px solid var(--${t.priority})">
                    📌 ${t.title} (${t.subject})
                </div>
            `).join('');
        };

        // Carga inicial
        renderAlerts();
    </script>
</body>
</html>
