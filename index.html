<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Ordenando mis Actividades | Edición Premium Pro</title>
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --normal: #10b981;
            --important: #f59e0b;
            --urgent: #ef4444;
            --border: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        header {
            text-align: center;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--normal));
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .hero-banner {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 1.5rem;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .hero-banner img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
        }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        main {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 1;
        }

        section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
        }

        .hidden { display: none !important; }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover { background: var(--primary-hover); }

        .task-card {
            background: #f8fafc;
            border-left: 5px solid var(--normal);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-card.urgente { border-left-color: var(--urgent); }
        .task-card.importante { border-left-color: var(--important); }
        .task-card.completed { opacity: 0.6; text-decoration: line-through; }

        @keyframes pulseAlert {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.01); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .alert-box {
            background: #fff8f6;
            border: 2px solid var(--urgent);
            padding: 1.25rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            animation: pulseAlert 2s infinite;
        }

        .alert-box.success {
            background: #f0fdf4;
            border-color: var(--normal);
            animation: none;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 1rem;
        }

        .cal-header {
            text-align: center;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding-bottom: 0.5rem;
        }

        .cal-day {
            min-height: 55px;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .cal-day:hover {
            background: #e0e7ff;
            border-color: var(--primary);
        }

        .cal-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 4px;
        }

        .cal-badge.urgente { background-color: var(--urgent); box-shadow: 0 0 6px var(--urgent); }
        .cal-badge.importante { background-color: var(--important); box-shadow: 0 0 6px var(--important); }
        .cal-badge.normal { background-color: var(--normal); box-shadow: 0 0 6px var(--normal); }

        .cal-day.today {
            border: 2px dashed var(--primary) !important;
            background: #eef2ff;
        }

        .cal-day.selected {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary-hover) !important;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media(max-width: 600px) {
            .hero-banner { grid-template-columns: 1fr; }
            .hero-banner img { height: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 ORDENANDO MIS ACTIVIDADES</h1>
        <p>Tu espacio de estudio potenciado &bull; Versión Premium Pro</p>
    </header>

    <main>
        <div class="hero-banner">
            <img src="https://images.unsplash.com/photo-1654356709115-3f68998bead4?auto=format&fit=crop&fm=jpg&q=80&w=600" alt="Estudio">
            <div>
                <p style="font-weight: 600;">“Cada pequeño paso te acerca a tu meta.”</p>
                <span style="color: var(--text-muted); font-size: 0.9rem;">Organizá tu tiempo, sé constante y alcanzá tus objetivos.</span>
            </div>
        </div>

        <nav class="tabs-nav" id="mainNav">
            <button class="tab-btn active" onclick="switchTab('inicio')">🏠 Inicio</button>
            <button class="tab-btn" onclick="switchTab('tareas')">📋 Tareas</button>
            <button class="tab-btn" onclick="switchTab('agregar')">➕ Nueva Tarea</button
