<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Ordenando mis Actividades</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg">
    <link rel="apple-touch-icon" href="./icon-192.svg">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --normal: #10b981;
            --important: #f59e0b;
            --urgent: #ef4444;
            --border: #cbd5e1;
            --radius: 12px;
            --whatsapp: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        header {
            text-align: center;
            padding: 1.5rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
            position: relative;
        }

        header h1 { font-size: 1.5rem; color: var(--text); margin-bottom: 0.25rem; }
        header p { color: var(--text-muted); font-size: 0.9rem; }

        .badge-pro {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-top: 0.4rem;
            text-transform: uppercase;
        }
        .badge-pro.active-pro {
            background: #d1fae5;
            color: #065f46;
        }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab-btn {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        main { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; flex: 1; }

        section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .hidden { display: none !important; }
        h2 { font-size: 1.2rem; margin-bottom: 0.75rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-wa {
            background: var(--whatsapp);
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            margin-top: 0.5rem;
            text-align: center;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-wa:hover { background: #1ebc57; }

        .task-card {
            background: #f8fafc;
            border-left: 4px solid var(--normal);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-card.urgente { border-left-color: var(--urgent); }
        .task-card.importante { border-left-color: var(--important); }
        .task-card.completed { opacity: 0.5; text-decoration: line-through; }

        .alert-box {
            background: #fef2f2;
            border: 2px solid var(--urgent);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        .alert-box.success { background: #f0fdf4; border-color: var(--normal); }

        /* Banner de Venta / Upgrade */
        .upgrade-banner {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            border: 2px dashed var(--primary);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .upgrade-banner h3 { color: var(--primary); margin-bottom: 0.25rem; font-size: 1.1rem; }
        .upgrade-banner p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }

        /* Calendario */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 0.5rem; }
        .cal-header { text-align: center; font-weight: 700; color: var(--text-muted); font-size: 0.8rem; }
        .cal-day {
            min-height: 55px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            position: relative;
        }
        .cal-day:hover { background: #e0e7ff; border-color: var(--primary); }
        .cal-day.today { border: 2px dashed var(--primary); }
        .cal-day.selected { background: var(--primary); color: #fff; }
        .cal-day.selected span { color: #fff; }

        .cal-badges-container {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
            max-width: 90%;
        }
        .cal-badge { width: 7px; height: 7px; border-radius: 50%; }
        .cal-badge.urgente { background: var(--urgent); }
        .cal-badge.importante { background: var(--important); }
        .cal-badge.normal { background: var(--normal); }

        footer { text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

        <h1>📚 ORDENANDO MIS ACTIVIDADES</h1>
        <p>Tu organizador inteligente</p>
        <div id="licenseBadge" class="badge-pro">Versión Demo (Gratis)</div>
    </header>
